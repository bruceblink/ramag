[package]
name = "ramag-infra-mysql"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Ramag MySQL 驱动实现（实现 Domain 的 Driver trait，封装 sqlx）"

[lints]
workspace = true

[dependencies]
ramag-infra-tunnel = { workspace = true }
# SSH 隧道就绪探测为阻塞调用，经 spawn_blocking 隔离（workspace 既有依赖复用）
tokio = { workspace = true }
ramag-domain = { workspace = true }
# 关系型 DB 共享层：runtime 桥接 / SqlBackend trait / impl_driver_for! 宏
ramag-infra-sql-shared = { workspace = true }

# MySQL 驱动；DECIMAL 用 BigDecimal 精确解码，避免浮点丢精度
sqlx = { workspace = true, features = ["bigdecimal"] }

# trait 上的 async fn
async-trait = { workspace = true }

# 时间类型
chrono = { workspace = true }

# JSON 类型
serde_json = { workspace = true }

# 日志
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
