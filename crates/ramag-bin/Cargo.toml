[package]
name = "ramag-bin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Ramag 主二进制：注册 tools + 打开主窗口"

[lints]
workspace = true

[[bin]]
name = "ramag"
path = "src/main.rs"

[dependencies]
ramag-domain = { workspace = true }
ramag-app = { workspace = true }
ramag-ui = { workspace = true }
# dbclient 是统一连接入口，已 transitively 依赖 ramag-tool-redis；bin 不再直接依赖
ramag-tool-dbclient = { workspace = true }
# bin 直接依赖 ramag-tool-mongodb 是为了拿 NewMongoQueryTab / RunMongoQuery / FormatMongoJson 这些 Action 类型来绑快捷键
ramag-tool-mongodb = { workspace = true }
ramag-tool-vcs = { workspace = true }
ramag-tool-clipboard = { workspace = true }
ramag-infra-mysql = { workspace = true }
ramag-infra-postgres = { workspace = true }
ramag-infra-redis = { workspace = true }
ramag-infra-mongodb = { workspace = true }
ramag-infra-storage = { workspace = true }
ramag-infra-git = { workspace = true }
ramag-infra-clipboard = { workspace = true }
ramag-infra-tunnel = { workspace = true }

# GPUI
gpui = { workspace = true }
gpui_platform = { workspace = true }
gpui-component = { workspace = true }

# 异步
tokio = { workspace = true }

# 错误处理
anyhow = { workspace = true }

# 日志
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Action 派生（Quit 菜单项需要）
serde = { workspace = true }
schemars = { workspace = true }

# 日志文件路径（由 ProjectDirs 按平台定位）
directories = { workspace = true }
rfd = { workspace = true }

# Windows 平台集成：系统托盘（Shell_NotifyIcon）+ 单实例（命名互斥体/事件）
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.57", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Windows exe 图标嵌入（build.rs 用；winresource 跨平台可编，仅 target=windows 时真正嵌入）
[build-dependencies]
winresource = "0.1"
