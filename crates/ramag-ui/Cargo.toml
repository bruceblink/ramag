[package]
name = "ramag-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Ramag 共享 UI：主壳（Shell）+ 主题，依赖 GPUI"

[lints]
workspace = true

[dependencies]
ramag-domain = { workspace = true }
ramag-app = { workspace = true }

# GPUI 桌面 UI 框架
gpui = { workspace = true }
gpui-component = { workspace = true }
# 上游 Assets 兜底：自定义 AssetSource 找不到本地 svg 时回查上游内置图标
gpui-component-assets = { workspace = true }
url = { workspace = true }

# 日志
tracing = { workspace = true }

# 内嵌 ramag 自己的 svg（home/database/wand-sparkles 等）到二进制
rust-embed = { version = "8", features = ["interpolate-folder-path"] }

# Action 派生需要：CloseTab 等共享 action 用 schemars/serde 实现 GPUI Action trait
schemars = { workspace = true }
serde = { workspace = true }
# 窗口位置尺寸偏好序列化（workspace 既有依赖复用）
serde_json = { workspace = true }
# 异步偏好写入串行化：快速切换时确保最后一次选择最终落盘。
futures = { workspace = true }
# 导入选项对话框内的系统文件多选框（workspace 既有依赖复用）
rfd = { workspace = true }
# 按需出现的分隔面板需共享一次性待恢复状态；复用 workspace 既有同步原语。
parking_lot = { workspace = true }

[dev-dependencies]
# 侧栏交互测试：验证外部链接交由 GPUI 测试平台打开。
gpui = { workspace = true, features = ["test-support"] }
