[package]
name = "ramag-infra-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Ramag 本地存储实现（redb + aes-gcm + 系统凭据库）"

[lints]
workspace = true

[dependencies]
ramag-domain = { workspace = true }

# 嵌入式 KV 存储
redb = { workspace = true }

# 异步：用 std::thread + futures::oneshot 桥接，无需 tokio runtime（兼容 GPUI smol 上下文）
async-trait = { workspace = true }
futures = { workspace = true }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }

# 剪贴历史过期清理算 cutoff（workspace 既有依赖，零新增编译单元）
chrono = { workspace = true }

# 日志
tracing = { workspace = true }

# 路径定位
directories = { workspace = true }
parking_lot = { workspace = true }
# 深度搜索后台扫描与带密钥 Bloom 预筛。
rayon = { workspace = true }
siphasher = { workspace = true }

# 加密
aes-gcm = { workspace = true }
# 从主密钥域分离派生搜索 token 密钥。
sha2 = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# 系统凭据库：按 target 选择原生后端；Linux 使用 Secret Service（GNOME Keyring 等兼容实现）。
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service", "crypto-rust"] }
