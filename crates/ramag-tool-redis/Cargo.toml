[package]
name = "ramag-tool-redis"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Ramag Redis 视图组件（由 dbclient 装载）：连接会话 / Key 树 / 值展示与编辑"

[lints]
workspace = true

[dependencies]
ramag-domain = { workspace = true }
ramag-app = { workspace = true }
ramag-ui = { workspace = true }

# GPUI
gpui = { workspace = true }
gpui-component = { workspace = true }

# 异步组合（key_detail 并发拉值 + TTL 用 futures::join）
futures = { workspace = true }

# 按 DB 导出 / 导入：系统文件选择框 + 导出文件名时间戳（与 dbclient / mongodb 工具一致）
rfd = { workspace = true }
chrono = { workspace = true }

# 值显示增强：JSON pretty / base64 切换 / Gzip 解压
serde_json = { workspace = true }
base64 = "0.22"
flate2 = "1"

# GPUI Action 派生（主修饰键+E 切换命令行控制台，仅 derive 用）
serde = { workspace = true }
schemars = { workspace = true }

# 命令行补全 provider（实现 gpui-component CompletionProvider）
anyhow = { workspace = true }
lsp-types = { workspace = true }
ropey = { workspace = true }

# 日志
tracing = { workspace = true }

[dev-dependencies]
# 渲染测试：gpui test-support 提供 #[gpui::test] / TestAppContext / debug_bounds（headless 渲染）
gpui = { workspace = true, features = ["test-support"] }
# mock KvDriver / Storage（trait 用 #[async_trait]）
async-trait = { workspace = true }
