name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "已有的 v* 注释标签；留空时只构建 Artifact，不发布"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-package:
    name: Build and verify Windows package
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $ChannelLine = Get-Content rust-toolchain.toml |
            Where-Object { $_ -match '^\s*channel\s*=' } |
            Select-Object -First 1
          if ($ChannelLine -notmatch '"([^"]+)"') {
            throw "rust-toolchain.toml does not contain a valid channel."
          }
          $Toolchain = $Matches[1]
          rustup toolchain install $Toolchain --profile minimal
          rustup target add --toolchain $Toolchain x86_64-pc-windows-msvc
          rustup run $Toolchain rustc -Vv
          rustup run $Toolchain cargo -V

      - name: Restore Windows Cargo download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            windows-cargo-

      - name: Test Windows packaging logic
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0 -ErrorAction Stop
          New-Item -ItemType Directory -Path ./target/test-results -Force | Out-Null
          $PesterConfig = New-PesterConfiguration
          $PesterConfig.Run.Path = "./scripts/windows/package.Tests.ps1"
          $PesterConfig.Run.Exit = $true
          $PesterConfig.TestResult.Enabled = $true
          $PesterConfig.TestResult.OutputPath = "./target/test-results/windows-package.xml"
          Invoke-Pester -Configuration $PesterConfig

      - name: Build, package, and smoke test Windows
        shell: pwsh
        run: ./scripts/package-windows.ps1 -SmokeTest

      - name: Upload verified Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ramag-windows-${{ github.sha }}
          path: |
            target/windows-dist/Ramag-*-windows-x64-setup.exe
            target/windows-dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  macos-package:
    name: Build and verify macOS package
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(
            awk -F '"' '/^[[:space:]]*channel[[:space:]]*=/ { print $2; exit }' \
              rust-toolchain.toml
          )"
          [[ -n "$toolchain" ]]
          rustup toolchain install "$toolchain" --profile minimal
          rustup target add --toolchain "$toolchain" \
            aarch64-apple-darwin \
            x86_64-apple-darwin
          rustup run "$toolchain" rustc -Vv
          rustup run "$toolchain" cargo -V
          sw_vers
          uname -m
          xcodebuild -version
          jq --version

      - name: Restore macOS Cargo download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-arm64-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            macos-arm64-cargo-

      - name: Test macOS packaging logic
        shell: bash
        run: make mac-package-test

      - name: Build and package macOS
        shell: bash
        run: make mac-package

      - name: Upload verified macOS package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ramag-macos-${{ github.sha }}
          path: |
            target/macos-dist/Ramag-*-macos-arm64.dmg
            target/macos-dist/Ramag-*-macos-x86_64.dmg
            target/macos-dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs:
      - windows-package
      - macos-package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: desktop-release
    permissions:
      contents: write
    steps:
      - name: Download verified Windows package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ramag-windows-${{ github.sha }}
          path: release-input/windows

      - name: Download verified macOS package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ramag-macos-${{ github.sha }}
          path: release-input/macos

      - name: Verify and combine release assets
        shell: bash
        run: |
          set -euo pipefail
          windows_dir="release-input/windows"
          macos_dir="release-input/macos"
          shopt -s nullglob
          installers=("$windows_dir"/Ramag-*-windows-x64-setup.exe)
          arm_disk_images=("$macos_dir"/Ramag-*-macos-arm64.dmg)
          intel_disk_images=("$macos_dir"/Ramag-*-macos-x86_64.dmg)
          [[ ${#installers[@]} -eq 1 ]]
          [[ ${#arm_disk_images[@]} -eq 1 ]]
          [[ ${#intel_disk_images[@]} -eq 1 ]]
          [[ -f "$windows_dir/SHA256SUMS.txt" ]]
          [[ -f "$macos_dir/SHA256SUMS.txt" ]]
          (cd "$windows_dir" && sha256sum --check SHA256SUMS.txt)
          (cd "$macos_dir" && sha256sum --check SHA256SUMS.txt)

          mkdir release-assets
          cp \
            "${installers[0]}" \
            "${arm_disk_images[0]}" \
            "${intel_disk_images[0]}" \
            release-assets/
          cd release-assets
          sha256sum \
            Ramag-*-windows-x64-setup.exe \
            Ramag-*-macos-arm64.dmg \
            Ramag-*-macos-x86_64.dmg \
            >SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          assets=(
            Ramag-*-windows-x64-setup.exe
            Ramag-*-macos-arm64.dmg
            Ramag-*-macos-x86_64.dmg
            SHA256SUMS.txt
            update-manifest.json
          )
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$MANUAL_RELEASE_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          if [[ "$tag" != v* || "$tag" == "v" ]]; then
            echo "Release tag must start with v and contain a version: $tag" >&2
            exit 1
          fi

          installers=(Ramag-*-windows-x64-setup.exe)
          [[ ${#installers[@]} -eq 1 ]]
          version="${installers[0]#Ramag-}"
          version="${version%-windows-x64-setup.exe}"
          if [[ "$tag" != "v$version" ]]; then
            echo "Release tag $tag does not match packaged version $version." >&2
            exit 1
          fi

          tag_ref=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.type + " " + .object.sha')
          read -r tag_object_type tag_object_sha <<<"$tag_ref"
          if [[ "$tag_object_type" != "tag" || -z "$tag_object_sha" ]]; then
            echo "Release tag $tag must be an annotated tag with release notes." >&2
            exit 1
          fi
          notes=$(gh api "repos/$GH_REPO/git/tags/$tag_object_sha" --jq '.message')
          if [[ -z "${notes//[[:space:]]/}" ]]; then
            echo "Release tag $tag has no annotation message." >&2
            exit 1
          fi

          manifest_assets='[]'
          for asset in \
            Ramag-*-windows-x64-setup.exe \
            Ramag-*-macos-arm64.dmg \
            Ramag-*-macos-x86_64.dmg; do
            hash=$(awk -v asset="$asset" '$2 == asset { print $1 }' SHA256SUMS.txt)
            [[ "$hash" =~ ^[0-9a-f]{64}$ ]]
            size=$(stat --format='%s' "$asset")
            manifest_assets=$(jq -c \
              --arg name "$asset" \
              --argjson size "$size" \
              --arg sha256 "$hash" \
              '. + [{name: $name, size: $size, sha256: $sha256}]' \
              <<<"$manifest_assets")
          done
          jq -n \
            --argjson schema_version 1 \
            --arg version "$version" \
            --arg tag_name "$tag" \
            --arg notes "$notes" \
            --arg published_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --argjson assets "$manifest_assets" \
            '{
              schema_version: $schema_version,
              version: $version,
              tag_name: $tag_name,
              notes: $notes,
              published_at: $published_at,
              assets: $assets
            }' >update-manifest.json
          jq -e '.schema_version == 1 and (.assets | length) == 3' \
            update-manifest.json >/dev/null

          title="Ramag ${tag#v}"

          if is_draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $tag is already published; refusing to replace public assets." >&2
              exit 1
            fi
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --title "$title" --notes "$notes"
          else
            release_flags=(--draft --verify-tag --notes "$notes" --title "$title")
            if [[ "$tag" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$tag" "${assets[@]}" "${release_flags[@]}"
          fi

          gh release edit "$tag" --draft=false
