name: Bug report
description: 报告可复现的问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索已有 Issue，并移除密码、连接地址、用户名、令牌和业务数据。
        涉及安全漏洞或敏感信息时，请使用 Security 页面，不要创建公开 Issue。
  - type: input
    id: version
    attributes:
      label: Ramag 版本
      description: 例如 0.0.4、commit SHA，或从源码运行。
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 操作系统
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows x64
        - Linux x86_64
        - Other
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: 功能模块
      options:
        - Database
        - Git
        - SSH / SFTP
        - Object Storage
        - Clipboard
        - Update
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏日志
      description: 请勿粘贴凭据、连接字符串、私有 IP、业务数据或完整生产日志。
    validations:
      required: true
