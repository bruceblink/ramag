name: Feature request
description: 提出具体使用场景和改进建议
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: 感谢建议。请说明要解决的实际问题，而不仅是期望的界面或技术实现。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与当前问题
      description: 谁在什么场景下遇到了什么障碍？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的解决方式
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: checkboxes
    id: contribution
    attributes:
      label: 贡献意愿
      options:
        - label: 我愿意参与设计、测试或实现这个功能。
          required: false
